name: Generate contribution snake (both accounts)

on:
  schedule:
    - cron: "0 6 */3 * *"  # every 3 days, 06:00 UTC
  workflow_dispatch:       # lets you run it manually

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout Platane/snk (pinned release)
        uses: actions/checkout@v4
        with:
          repository: Platane/snk
          ref: v3.5.0
          path: snk

      - uses: oven-sh/setup-bun@v2

      - name: Generate merged snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNK_USERS: maycolperez-blip,lnagad
          SNK_OUTPUTS: |
            ${{ github.workspace }}/dist/github-contribution-grid-snake.svg
            ${{ github.workspace }}/dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
        run: |
          cd snk
          bun install --frozen-lockfile
          cp ../scripts/merged-snake.ts packages/generate-snake-animation/
          cd packages/generate-snake-animation
          bun merged-snake.ts

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}